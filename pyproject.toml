[project]
name = "scene-intelligence"
version = "0.1.0"
description = "On-prem AI video scene search for broadcast newsrooms (MVP scaffold)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139,<0.140",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pgvector>=0.3",
    "httpx>=0.28",
    # Decode video cho bước detect (pipeline/detect_backends.py).
    # Ghim <0.7: từ 0.7 scenedetect phụ thuộc CỨNG vào opencv-python bản GUI (bỏ extra
    # headless), kéo theo libGL/libxcb mà image slim không có -> ImportError lúc import
    # cv2. Nhánh 0.6 còn extra `opencv-headless` nên chỉ cài opencv-python-headless.
    "scenedetect[opencv-headless]>=0.6.4,<0.7",
]

[project.optional-dependencies]
# Stage enrich (ASR + OCR) — TÁCH RIÊNG khỏi dependencies chính vì kéo theo torch:
# thêm ~2-3 GB vào image, trong khi API và bước detect hoàn toàn không cần.
# Node worker có bật ENRICH_ON_INGEST mới cần: `uv pip install -e '.[enrich]'`.
# Trọng số KHÔNG nằm trong các gói này — xem deploy/fetch-models.sh.
enrich = [
    "faster-whisper>=1.1",   # PhoWhisper-large chạy qua CTranslate2
    "easyocr>=1.7",          # chỉ dùng phần dò vùng chữ (CRAFT)
    "vietocr>=0.3.13",       # bản Python pbcquoc, KHÔNG phải app Java trùng tên
]
# Chỉ cần trên máy CÓ Internet dùng để dựng trọng số (deploy/fetch-models.sh), không cần
# trên node chạy production. ct2-transformers-converter đi kèm ctranslate2.
fetch-models = [
    "transformers>=4.44",
    "huggingface-hub>=0.26",
    "ctranslate2>=4.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
include = ["api*", "pipeline*", "search*", "models*", "eval*", "shared*"]
