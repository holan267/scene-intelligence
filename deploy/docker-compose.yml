# On-prem, 1 node, air-gap được (AD-14). Không dịch vụ cloud runtime.
#
# Worker KHÔNG nằm trong compose: chạy TRÊN HOST bằng `deploy/run-worker.sh`.
# Lý do: stage enrich nạp PhoWhisper-large in-process (~6 GB vì CTranslate2 buộc phải
# convert float16 -> float32 trên CPU không hỗ trợ fp16), còn describe/embed gọi sang
# Ollama cũng ở host. Đóng gói worker vào image kéo theo torch (+~3 GB) rồi vẫn phải
# mount cả media lẫn trọng số ra ngoài — không được gì mà tốn thêm một tầng.
# Migration `alembic upgrade head` do service `api` chạy (deploy/entrypoint.sh), nên
# worker host không cần tự chạy.
services:
  postgres:
    image: pgvector/pgvector:pg18   # PostgreSQL 18 + pgvector 0.8.x (AD-4)
    environment:
      POSTGRES_USER: scene
      POSTGRES_PASSWORD: scene
      POSTGRES_DB: scene_intelligence
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scene -d scene_intelligence"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://scene:scene@postgres:5432/scene_intelligence
      MEDIA_BACKEND: filesystem
      MEDIA_ROOT: /data/media          # mount NAS/SAN cho kho thật; ổ local cho dev
      API_ENV: dev
      # BGE-M3 chạy NGOÀI compose (Ollama trên host, cần Metal/GPU mà container không có).
      # host.docker.internal = máy host nhìn từ trong container; localhost sẽ trỏ vào
      # chính container này và gây 502 "Gọi BGE-M3 thất bại: All connection attempts failed".
      EMBED_MODEL_URL: ${EMBED_MODEL_URL:-http://host.docker.internal:11434}
    volumes:
      # Đường host đặt trong MEDIA_HOST_PATH (deploy/.env) — khác nhau theo máy:
      # Windows: D:/media   |   macOS/Linux: /Volumes/media, /mnt/media...
      # Mặc định: ../_data/media (tương đối so với deploy/, dùng cho dev).
      - ${MEDIA_HOST_PATH:-../_data/media}:/data/media
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
