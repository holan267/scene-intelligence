# On-prem, 1 node, air-gap được (AD-14). Không dịch vụ cloud runtime.
services:
  postgres:
    image: pgvector/pgvector:pg18   # PostgreSQL 18 + pgvector 0.8.x (AD-4)
    environment:
      POSTGRES_USER: scene
      POSTGRES_PASSWORD: scene
      POSTGRES_DB: scene_intelligence
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scene -d scene_intelligence"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://scene:scene@postgres:5432/scene_intelligence
      MEDIA_BACKEND: filesystem
      MEDIA_ROOT: /data/media          # mount NAS/SAN cho kho thật; ổ local cho dev
      API_ENV: dev
      # BGE-M3 chạy NGOÀI compose (Ollama trên host, cần Metal/GPU mà container không có).
      # host.docker.internal = máy host nhìn từ trong container; localhost sẽ trỏ vào
      # chính container này và gây 502 "Gọi BGE-M3 thất bại: All connection attempts failed".
      EMBED_MODEL_URL: ${EMBED_MODEL_URL:-http://host.docker.internal:11434}
    volumes:
      # Đường host đặt trong MEDIA_HOST_PATH (deploy/.env) — khác nhau theo máy:
      # Windows: D:/media   |   macOS/Linux: /Volumes/media, /mnt/media...
      # Mặc định: ../_data/media (tương đối so với deploy/, dùng cho dev).
      - ${MEDIA_HOST_PATH:-../_data/media}:/data/media
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        # true => image worker có thêm faster-whisper/easyocr/vietocr (+~2-3 GB vì torch).
        # Bắt buộc bật cùng ENRICH_ON_INGEST, nếu không stage enrich sẽ fail lúc nạp model.
        INSTALL_ENRICH: ${INSTALL_ENRICH:-false}
    environment:
      DATABASE_URL: postgresql+psycopg://scene:scene@postgres:5432/scene_intelligence
      MEDIA_BACKEND: filesystem
      MEDIA_ROOT: /data/media
      API_ENV: dev
      EMBED_MODEL_URL: ${EMBED_MODEL_URL:-http://host.docker.internal:11434}
      # Detect chạy trong worker (PySceneDetect/OpenCV, CPU) — không cần model server.
      DETECT_ON_INGEST: ${DETECT_ON_INGEST:-true}
      DETECT_THRESHOLD: ${DETECT_THRESHOLD:-27.0}
      # ASR (PhoWhisper-large) + OCR (VietOCR) cũng chạy TRONG worker, không qua model
      # server: cả hai nạp model in-process chứ không có endpoint OpenAI-compatible.
      # Mặc định TẮT. Cần CẢ HAI: INSTALL_ENRICH=true (thư viện) + trọng số trong /models
      # (dựng bằng deploy/fetch-models.sh). Thiếu một trong hai => task rơi vào 'error'
      # kèm thông báo chỉ rõ thiếu gì.
      ENRICH_ON_INGEST: ${ENRICH_ON_INGEST:-false}
      # false => chỉ chạy ASR, KHÔNG đụng scene.ocr_text (dùng khi trọng số OCR chưa sẵn).
      ENRICH_OCR: ${ENRICH_OCR:-true}
      ASR_MODEL_DIR: ${ASR_MODEL_DIR:-/models/PhoWhisper-large-ct2}
      OCR_DETECTOR_DIR: ${OCR_DETECTOR_DIR:-/models/easyocr}
      OCR_RECOGNIZER_DIR: ${OCR_RECOGNIZER_DIR:-/models/vietocr}
      # cpu | cuda — EasyOCR/VietOCR. Node có GPU thì đặt cuda (OCR hàng trăm keyframe/video).
      ENRICH_DEVICE: ${ENRICH_DEVICE:-cpu}
    volumes:
      - ${MEDIA_HOST_PATH:-../_data/media}:/data/media
      # Trọng số model để ngoài image (nặng, không commit) — nạp sẵn cho air-gap (AD-14).
      # :ro vì runtime chỉ ĐỌC; mọi đường tải đã bị chặn trong enrich_backends.py.
      - ${MODEL_HOST_PATH:-../_data/models}:/models:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && python -m pipeline.worker_main"]

volumes:
  pgdata:
